name: CI/CD — Build Frontend (dist) & Deploy to Caddy Volume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-frontend:
    name: Compilar React (dist) y Enviar al Volumen de Caddy
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias limpias
        run: npm ci

      - name: 4. Compilar Frontend (npm run build) inyectando variables desde Secrets
        env:
          # Por defecto vacío ("") para que todas las peticiones usen /api/* relativo detrás de Caddy
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_ADAPTACION_EDAD: ${{ secrets.VITE_ADAPTACION_EDAD || 'true' }}
        run: npm run build

      - name: 5. Enviar carpeta dist por SCP al servidor Linux (Volumen ./dist:/srv/dist de Caddy)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.SERVER_BACKEND_PATH || '/home/serverportable/Documentos/JuegosAsistodo/juegos-mayores-actualizaciones-back' }}
          overwrite: true

      - name: 6. Verificar permisos de lectura para Caddy (Sin reiniciar contenedores)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_DIR="${{ secrets.SERVER_BACKEND_PATH || '/home/serverportable/Documentos/JuegosAsistodo/juegos-mayores-actualizaciones-back' }}"
            mkdir -p "$DEPLOY_DIR/dist"
            chmod -R a+rX "$DEPLOY_DIR/dist"
            echo "✅ Carpeta dist actualizada en vivo para Caddy (/srv/dist) sin reiniciar contenedores."
