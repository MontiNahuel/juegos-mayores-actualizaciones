<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock · Medallas del perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --app-background: #151e2b;
      --app-panel: #2a394c;
      --app-panel-raised: #34465b;
      --app-border: #52647b;
      --app-text: #f3f6fa;
      --app-copy: #c0cbd7;
      --teal: #8bd9cc;
      --gold: #edd499;
      --bronze: #e2a76f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 36px 24px 64px;
      background:
        radial-gradient(70% 45% at 50% 0%, #1d2a3a 0%, transparent 70%),
        var(--app-background);
      color: var(--app-text);
      font-family: "Nunito Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell { width: min(1180px, 100%); margin: 0 auto; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .section-head h1 {
      margin: 0;
      font-size: 1.375rem;
      line-height: 1.3;
      font-weight: 900;
    }

    /* ---------- Selector de mes ---------- */
    .month-wrap { position: relative; }

    .month-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 12px 8px 14px;
      border: 1px solid #526176;
      border-radius: 10px;
      background: #263548;
      color: var(--app-text);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease;
    }

    .month-button:hover { background: #28384b; border-color: #64778f; }
    .month-button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .month-button .chevron { transition: transform .18s ease; }
    .month-button[aria-expanded="true"] .chevron { transform: rotate(180deg); }

    .month-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 5;
      width: 244px;
      margin: 0;
      padding: 6px;
      list-style: none;
      border: 1px solid #526176;
      border-radius: 12px;
      background: #263548;
      box-shadow: 0 22px 40px -18px rgba(3, 8, 14, .9);
    }

    .month-menu[hidden] { display: none; }

    .month-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--app-copy);
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .month-option:hover { background: #30425a; color: var(--app-text); }
    .month-option:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

    .month-option[aria-current="true"] {
      background: rgba(139, 217, 204, .12);
      color: var(--teal);
    }

    .month-option .tag {
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(139, 217, 204, .14);
      color: var(--teal);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .month-option[data-empty="true"] { color: #7f8da0; }

    /* ---------- Carrusel de consejos ---------- */
    .tip {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "head window nav";
      gap: 14px;
      margin: 0 0 20px;
      padding: 16px 16px 16px 18px;
      border: 1px solid #4b5d73;
      border-radius: 16px;
      background:
        linear-gradient(90deg, rgba(237, 212, 153, .07), transparent 42%),
        #263548;
    }

    .tip-head {
      grid-area: head;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .tip-icon {
      display: flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: rgba(237, 212, 153, .12);
      color: var(--gold);
    }

    .tip-icon svg { width: 20px; height: 20px; }

    .tip-window { grid-area: window; overflow: hidden; }

    .tip-track {
      display: flex;
      margin: 0;
      padding: 0;
      list-style: none;
      transition: transform .45s cubic-bezier(.4, 0, .2, 1);
    }

    .tip-slide { flex: 0 0 100%; min-width: 0; }

    .tip-kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .tip-text {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--app-text);
    }

    .tip-source {
      margin: 7px 0 0;
      font-size: 11.5px;
      color: var(--app-copy);
    }

    .tip-source a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #6b7f97;
      text-underline-offset: 2px;
    }

    .tip-source a:hover { color: var(--teal); text-decoration-color: currentColor; }

    .tip-nav {
      grid-area: nav;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .tip-arrows { display: flex; gap: 6px; }

    .tip-btn {
      display: flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border: 1px solid #526176;
      border-radius: 9px;
      background: #2f4055;
      color: var(--app-text);
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease;
    }

    .tip-btn:hover { background: #354860; border-color: #64778f; }
    .tip-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .tip-btn svg { width: 16px; height: 16px; }

    .tip-dots { display: flex; gap: 5px; }

    .tip-dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #5a6c83;
      cursor: pointer;
      transition: width .2s ease, background-color .2s ease;
    }

    .tip-dot[aria-current="true"] { width: 16px; background: var(--gold); }
    .tip-dot:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

    @media (max-width: 640px) {
      .tip {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "head"
          "window"
          "nav";
        gap: 12px;
        padding: 14px;
      }

      .tip-head { flex-direction: row; align-items: center; gap: 10px; }
      .tip-icon { width: 32px; height: 32px; border-radius: 9px; }
      .tip-icon svg { width: 17px; height: 17px; }
      .tip-text { font-size: 13.5px; line-height: 1.4; }
      .tip-source { margin-top: 6px; font-size: 11px; }
      .tip-nav { flex-direction: row; align-items: center; justify-content: space-between; }
      .tip-btn { width: 32px; height: 32px; }
    }

    /* ---------- Tabs de juego ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid #52647b;
      border-radius: 999px;
      background: transparent;
      color: var(--app-copy);
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease, color .16s ease;
    }

    .tab svg { width: 16px; height: 16px; flex-shrink: 0; }
    .tab:hover { border-color: #6b7f97; color: var(--app-text); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tab[aria-selected="true"] {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
    }

    .tab .cuenta {
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      color: inherit;
      font-size: 11px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .tab[aria-selected="true"] .cuenta { background: color-mix(in srgb, var(--accent) 24%, transparent); }
    .tab[data-vacio="true"] .cuenta { opacity: .45; }

    /* ---------- Tarjeta única ---------- */
    .card {
      margin-top: 14px;
      padding: 24px 26px;
      border: 1px solid var(--app-border);
      border-radius: 16px;
      background: var(--app-panel);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .game-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
    }

    .game-icon svg { width: 21px; height: 21px; }

    .card-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 900;
    }

    .card-head .enfoque {
      margin: 2px 0 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--accent);
    }

    .card-head .total {
      margin-left: auto;
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .card-body {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 26px;
      margin-top: 20px;
    }

    @media (max-width: 820px) {
      .card-body { grid-template-columns: 1fr; gap: 20px; }
      .card { padding: 20px; }
    }

    .label {
      margin: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--app-copy);
    }

    .label strong {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
      color: var(--app-text);
      font-variant-numeric: tabular-nums;
    }

    .medals {
      display: flex;
      gap: 10px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    /* Sello: el número manda y la letra queda estampada con su aro. */
    .seal {
      position: relative;
      display: block;
      flex: 1;
      min-width: 0;
      height: 60px;
      padding: 9px 10px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--grade) 26%, transparent);
      border-radius: 12px;
      background: color-mix(in srgb, var(--grade) 9%, transparent);
      font-variant-numeric: tabular-nums;
    }

    .seal .cantidad {
      display: block;
      font-size: 26px;
      line-height: 1;
      font-weight: 900;
      color: var(--grade);
    }

    .seal .marca {
      position: absolute;
      right: 7px;
      bottom: 6px;
      display: flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .seal .marca .letra {
      transform: rotate(-12deg);
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
      color: color-mix(in srgb, var(--grade) 76%, transparent);
    }

    .seal .aro {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: color-mix(in srgb, var(--grade) 52%, transparent);
    }

    .seal[data-cero="true"] { opacity: .38; }

    @media (max-width: 520px) {
      .medals { gap: 6px; }
      .seal { height: 58px; padding: 7px; }
      .seal .cantidad { font-size: 21px; }
      .seal .marca { right: 4px; bottom: 4px; width: 26px; height: 26px; }
      .seal .marca .letra { font-size: 13px; }
    }

    .g-S { --grade: #F0CC80; }
    .g-A { --grade: #8FD9CC; }
    .g-B { --grade: #A9C8EE; }
    .g-C { --grade: #C3CEDA; }
    .g-F { --grade: #E79586; }

    .history {
      margin: 10px 0 0;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--app-copy);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 16px 0 0;
      border-top: 1px solid #3d4f65;
    }

    .stats div { min-width: 0; }

    .stats dt {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      font-size: 11.5px;
      color: var(--app-copy);
    }

    .stats dd {
      margin: 4px 0 0;
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .last {
      margin: 12px 0 0;
      font-size: 12px;
      color: var(--app-copy);
    }

    .empty {
      margin: 10px 0 0;
      padding: 14px;
      border: 1px dashed #52647b;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--app-copy);
      text-align: center;
    }

    .empty[hidden] { display: none; }

    /* ---------- Tu progreso ---------- */
    .progress-panel {
      display: grid;
      grid-template-columns: minmax(210px, 258px) minmax(0, 1fr);
      gap: 26px;
      margin: 0 0 22px;
      padding: 20px 22px 16px;
      border: 1px solid #4b5d73;
      border-radius: 16px;
      background: var(--app-panel);
    }

    .pp-kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .pp-total {
      margin: 9px 0 0;
      font-size: 13.5px;
      line-height: 1.35;
      color: var(--app-copy);
    }

    .pp-total strong {
      display: block;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.02em;
      color: var(--teal);
      font-variant-numeric: tabular-nums;
    }

    .pp-copy .delta { margin-top: 12px; }

    .delta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      color: var(--app-copy);
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .delta svg { width: 11px; height: 11px; flex-shrink: 0; }
    .delta[data-signo="sube"] { background: rgba(139, 217, 204, .13); color: var(--teal); }

    .pp-chart { min-width: 0; }

    .pp-caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--app-copy);
    }

    .pp-caption span {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }

    .plot {
      position: relative;
      height: 136px;
      border-bottom: 1px solid #3d4f65;
    }

    .ref {
      position: absolute;
      right: 0;
      left: 0;
      border-top: 1px dashed #5b6d84;
    }

    .ref span {
      position: absolute;
      top: -9px;
      left: 0;
      padding: 0 6px;
      background: var(--app-panel);
      font-size: 10px;
      font-weight: 700;
      color: var(--app-copy);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .area {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .area .fill { fill: color-mix(in srgb, var(--teal) 14%, transparent); }

    .area .line {
      fill: none;
      stroke: var(--teal);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 2px var(--app-panel);
      transform: translate(-50%, 50%);
    }

    .dot-valor {
      position: absolute;
      transform: translate(-50%, 0);
      font-size: 12px;
      font-weight: 900;
      color: var(--teal);
      font-variant-numeric: tabular-nums;
    }

    .axis {
      position: relative;
      height: 17px;
      margin-top: 6px;
    }

    .axis span {
      position: absolute;
      transform: translateX(-50%);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--app-copy);
      text-transform: capitalize;
      white-space: nowrap;
    }

    .axis span[data-activo="true"] { color: var(--teal); }

    @media (max-width: 720px) {
      .progress-panel {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        padding: 16px 16px 12px;
      }

      .pp-total strong { font-size: 36px; }
      .plot { height: 118px; }
      .pp-caption { margin-bottom: 10px; }
      .axis span { font-size: 9.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="tip" id="tip" aria-label="Por qué estos juegos" aria-roledescription="carrusel">
      <div class="tip-head">
        <span class="tip-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.2.9 2V16h5.4v-.2c0-.8.3-1.5.9-2A6 6 0 0 0 12 3Z"/></svg>
        </span>
        <p class="tip-kicker">Sabías que…</p>
      </div>
      <div class="tip-window" id="tip-window">
        <ul class="tip-track" id="tip-track"></ul>
      </div>
      <div class="tip-nav">
        <div class="tip-arrows">
          <button type="button" class="tip-btn" id="tip-prev" aria-label="Consejo anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" class="tip-btn" id="tip-next" aria-label="Consejo siguiente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="tip-dots" id="tip-dots"></div>
      </div>
    </section>

    <section class="progress-panel" aria-labelledby="pp-kicker">
      <div class="pp-copy">
        <p class="pp-kicker" id="pp-kicker">Tu progreso</p>
        <p class="pp-total"><strong id="pp-total">0</strong>medallas en <span id="pp-year">2026</span></p>
        <span class="delta" id="progress-delta"></span>
      </div>

      <div class="pp-chart">
        <p class="pp-caption">Medallas por mes <span>Últimos 6 meses</span></p>
        <div class="plot" id="plot" role="img" aria-label="Medallas por mes">
          <div class="ref" id="ref-record"><span></span></div>
          <div class="ref" id="ref-promedio"><span></span></div>
          <svg class="area" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="fill" id="area-fill" d=""></path>
            <path class="line" id="area-line" d=""></path>
          </svg>
        </div>
        <div class="axis" id="axis" aria-hidden="true"></div>
      </div>
    </section>

    <section aria-labelledby="mock-medallas">
      <div class="section-head">
        <h1 id="mock-medallas">Medallas</h1>

        <div class="month-wrap">
          <button type="button" class="month-button" id="month-toggle" aria-expanded="false" aria-haspopup="listbox" aria-controls="month-menu">
            <span id="month-current">Noviembre 2026</span>
            <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="month-menu" id="month-menu" role="listbox" aria-label="Elegí un mes" hidden></ul>
        </div>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Juegos"></div>

      <article class="card" id="card" aria-live="polite">
        <header class="card-head">
          <span class="game-icon" id="game-icon" aria-hidden="true"></span>
          <div>
            <h2 id="game-title"></h2>
            <p class="enfoque" id="game-focus"></p>
          </div>
          <span class="total" id="game-total"></span>
        </header>

        <div class="card-body">
          <div>
            <p class="label"><span id="medals-label">Noviembre 2026</span></p>
            <ul class="medals" id="medals" aria-label="Medallas del mes"></ul>
            <p class="history" id="history"></p>
            <p class="empty" id="empty" hidden>No jugaste este juego en el mes elegido. Probá con otro mes u otro juego.</p>
          </div>

          <div>
            <dl class="stats">
              <div>
                <dt>Jugadas</dt>
                <dd id="stat-played"></dd>
              </div>
              <div>
                <dt>Mejor</dt>
                <dd id="stat-best"></dd>
              </div>
              <div>
                <dt>Promedio</dt>
                <dd id="stat-avg"></dd>
              </div>
            </dl>
            <p class="last" id="stat-last"></p>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const GRADOS = ['S', 'A', 'B', 'C', 'F'];
    const MESES = ['2026-11', '2026-10', '2026-09', '2026-08', '2026-07'];

    const ICONOS = {
      wordle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="8.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
      sopa_letras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',
      sudoku: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>',
      crucigrama: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.2h5.5M9 3.5V20.5"/></svg>',
    };

    const JUEGOS = [
      { id: 'wordle', corto: 'Wordle', titulo: 'Palabra del día', enfoque: 'Memoria y vocabulario', acento: '#99dcd1' },
      { id: 'sopa_letras', corto: 'Sopa', titulo: 'Sopa de letras', enfoque: 'Atención visual y rastreo', acento: '#f0bb98' },
      { id: 'sudoku', corto: 'Sudoku', titulo: 'Sudoku diario', enfoque: 'Lógica y concentración', acento: '#c8bbf0' },
      { id: 'crucigrama', corto: 'Crucigrama', titulo: 'Crucigrama diario', enfoque: 'Lenguaje y recuerdos', acento: '#a8ccef' },
    ];

    const HISTORICO = {
      wordle: { S: 41, A: 63, B: 38, C: 12, F: 4 },
      sopa_letras: { S: 27, A: 48, B: 31, C: 9, F: 3 },
      sudoku: { S: 18, A: 39, B: 44, C: 16, F: 7 },
      crucigrama: { S: 12, A: 21, B: 18, C: 8, F: 2 },
    };

    const RENDIMIENTO = {
      wordle: { completadas: 158, mejor: 62, promedio: 95, ultima: '2026-11-16' },
      sopa_letras: { completadas: 121, mejor: 74, promedio: 120, ultima: '2026-11-15' },
      sudoku: { completadas: 96, mejor: 138, promedio: 210, ultima: '2026-11-14' },
      crucigrama: { completadas: 61, mejor: 160, promedio: 245, ultima: '2026-11-12' },
    };

    const VACIO = { S: 0, A: 0, B: 0, C: 0, F: 0 };

    /* Consejos con respaldo: redacción observacional, sin prometer prevención. */
    const TIPS = [
      {
        texto: 'Actividades que estimulan la mente se asociaron con menor riesgo de Alzheimer en adultos mayores.',
        fuente: 'Wilson et al., JAMA, 2002',
        url: 'https://doi.org/10.1001/jama.287.6.742',
      },
      {
        texto: 'Aprender habilidades nuevas mejoró la memoria en adultos mayores más que las actividades rutinarias.',
        fuente: 'Park et al., Psychological Science, 2014',
        url: 'https://doi.org/10.1177/0956797613504966',
      },
      {
        texto: 'Entrenar una capacidad mejora sobre todo esa capacidad: conviene alternar lógica, lenguaje y atención.',
        fuente: 'Ball et al., JAMA, 2002',
        url: 'https://doi.org/10.1001/jama.288.18.2271',
      },
      {
        texto: 'La reserva cognitiva se construye a lo largo de la vida con educación y actividades mentales sostenidas.',
        fuente: 'Stern, Lancet Neurology, 2012',
        url: 'https://doi.org/10.1016/S1474-4422(12)70191-6',
      },
    ];

    const INTERVALO_TIP = 7000;
    const AUTO_TIP = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let tipActivo = 0;
    let tipTimer = null;

    /* Mismo aro punteado que usa el calendario para la S. */
    const ARO = '<svg class="aro" viewBox="0 0 48 48" fill="none" aria-hidden="true">'
      + '<circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.6 2.8"/>'
      + '<circle cx="24" cy="24" r="16.2" stroke="currentColor" stroke-width="1"/>'
      + '<circle cx="37.2" cy="10.8" r="1.2" fill="currentColor"/>'
      + '<circle cx="37.2" cy="37.2" r="1.2" fill="currentColor"/>'
      + '<circle cx="10.8" cy="37.2" r="1.2" fill="currentColor"/>'
      + '<circle cx="10.8" cy="10.8" r="1.2" fill="currentColor"/>'
      + '</svg>';

    const MESES_DATOS = {
      '2026-11': {
        wordle: { S: 6, A: 7, B: 5, C: 2, F: 1 },
        sopa_letras: { S: 4, A: 7, B: 5, C: 2, F: 0 },
        sudoku: { S: 2, A: 5, B: 5, C: 3, F: 0 },
        crucigrama: { S: 4, A: 3, B: 2, C: 0, F: 0 },
      },
      '2026-10': {
        wordle: { S: 3, A: 8, B: 5, C: 2, F: 1 },
        sopa_letras: { S: 4, A: 5, B: 3, C: 1, F: 0 },
        sudoku: { S: 2, A: 6, B: 6, C: 3, F: 2 },
        crucigrama: { S: 1, A: 3, B: 2, C: 2, F: 0 },
      },
      '2026-09': {
        wordle: { S: 5, A: 7, B: 4, C: 1, F: 0 },
        sopa_letras: { S: 1, A: 6, B: 4, C: 2, F: 0 },
        sudoku: { S: 0, A: 5, B: 7, C: 2, F: 1 },
        crucigrama: { S: 2, A: 2, B: 3, C: 1, F: 1 },
      },
      '2026-08': {
        wordle: { S: 2, A: 4, B: 6, C: 3, F: 1 },
        sopa_letras: { S: 3, A: 3, B: 2, C: 1, F: 1 },
        sudoku: { S: 2, A: 4, B: 3, C: 2, F: 0 },
        crucigrama: VACIO,
      },
      '2026-07': {
        wordle: { S: 3, A: 5, B: 2, C: 0, F: 0 },
        sopa_letras: { S: 0, A: 2, B: 4, C: 1, F: 0 },
        sudoku: { S: 1, A: 2, B: 5, C: 3, F: 1 },
        crucigrama: { S: 1, A: 1, B: 2, C: 0, F: 0 },
      },
      '2026-06': {
        wordle: { S: 4, A: 4, B: 4, C: 1, F: 0 },
        sopa_letras: { S: 1, A: 3, B: 3, C: 2, F: 0 },
        sudoku: { S: 1, A: 3, B: 4, C: 1, F: 1 },
        crucigrama: { S: 1, A: 2, B: 1, C: 1, F: 0 },
      },
      '2026-05': {
        wordle: { S: 2, A: 5, B: 3, C: 1, F: 0 },
        sopa_letras: { S: 1, A: 2, B: 4, C: 1, F: 0 },
        sudoku: { S: 0, A: 3, B: 4, C: 2, F: 0 },
        crucigrama: { S: 0, A: 1, B: 2, C: 0, F: 0 },
      },
      '2026-04': {
        wordle: { S: 3, A: 4, B: 3, C: 2, F: 0 },
        sopa_letras: { S: 0, A: 2, B: 3, C: 1, F: 0 },
        sudoku: { S: 1, A: 2, B: 3, C: 1, F: 1 },
        crucigrama: { S: 1, A: 1, B: 1, C: 1, F: 0 },
      },
      '2026-03': {
        wordle: { S: 2, A: 3, B: 3, C: 1, F: 0 },
        sopa_letras: { S: 0, A: 2, B: 2, C: 1, F: 0 },
        sudoku: { S: 0, A: 2, B: 3, C: 1, F: 1 },
        crucigrama: { S: 0, A: 1, B: 1, C: 0, F: 0 },
      },
      '2026-02': {
        wordle: { S: 1, A: 3, B: 2, C: 2, F: 0 },
        sopa_letras: { S: 0, A: 1, B: 2, C: 1, F: 0 },
        sudoku: { S: 0, A: 2, B: 2, C: 1, F: 1 },
        crucigrama: { S: 0, A: 1, B: 0, C: 0, F: 0 },
      },
    };

    let mesActivo = MESES[0];
    let juegoActivo = 'wordle';

    const $ = (id) => document.getElementById(id);

    function formatearMes(mes) {
      const [anio, numero] = mes.split('-').map(Number);
      const texto = new Intl.DateTimeFormat('es-AR', { month: 'long', year: 'numeric' })
        .format(new Date(anio, numero - 1, 1));
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function formatearDuracion(segundos) {
      if (typeof segundos !== 'number') return '—';
      const minutos = Math.floor(segundos / 60);
      const resto = Math.round(segundos % 60);
      return `${minutos}:${String(resto).padStart(2, '0')}`;
    }

    function formatearFecha(iso) {
      const [anio, mes, dia] = iso.split('-').map(Number);
      return new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'short' })
        .format(new Date(anio, mes - 1, dia));
    }

    const medallasDe = (mes, juego) => (MESES_DATOS[mes]?.[juego] ?? VACIO);
    const totalDe = (medallas) => GRADOS.reduce((total, grado) => total + medallas[grado], 0);

    function resumenHistorico(medallas) {
      const partes = GRADOS
        .filter((grado) => medallas[grado] > 0)
        .map((grado) => `${medallas[grado]} ${grado}`);
      return partes.length ? partes.join(' · ') : 'Sin medallas todavía';
    }

    /* ---------- Tu progreso ---------- */
    const FLECHA = {
      sube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
      baja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
    };

    /* Las F no cuentan como medalla: el panel suma solo S, A, B y C. */
    const GRADOS_CONTADOS = ['S', 'A', 'B', 'C'];

    function mesesVentana(mes, cantidad) {
      const [anio, numero] = mes.split('-').map(Number);
      const base = new Date(anio, numero - 1, 1);
      return Array.from({ length: cantidad }, (_, indice) => {
        const fecha = new Date(base.getFullYear(), base.getMonth() - (cantidad - 1 - indice), 1);
        return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
      });
    }

    function mesAnterior(mes) {
      const [anio, numero] = mes.split('-').map(Number);
      const fecha = new Date(anio, numero - 2, 1);
      return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
    }

    function nombreMes(mes, formato) {
      const [anio, numero] = mes.split('-').map(Number);
      return new Intl.DateTimeFormat('es-AR', { month: formato })
        .format(new Date(anio, numero - 1, 1))
        .replace('.', '');
    }

    const mesCorto = (mes) => nombreMes(mes, 'short');
    const mesLargo = (mes) => nombreMes(mes, 'long');

    const totalContado = (mes) => JUEGOS.reduce((suma, juego) => {
      const medallas = medallasDe(mes, juego.id);
      return suma + GRADOS_CONTADOS.reduce((subtotal, grado) => subtotal + medallas[grado], 0);
    }, 0);

    /* Curva suave con puntos de control horizontales sobre la serie. */
    function curva(puntos) {
      return puntos.reduce((trazo, punto, indice) => {
        if (indice === 0) return `M ${punto.x} ${punto.y}`;
        const previo = puntos[indice - 1];
        const medio = (previo.x + punto.x) / 2;
        return `${trazo} C ${medio} ${previo.y} ${medio} ${punto.y} ${punto.x} ${punto.y}`;
      }, '');
    }

    function pintarProgreso() {
      const actual = MESES[0];
      const anio = actual.slice(0, 4);
      const ventana = mesesVentana(actual, 6);
      const totales = ventana.map(totalContado);
      const record = Math.max(1, ...totales);
      const promedio = Math.round(totales.reduce((suma, total) => suma + total, 0) / totales.length);
      const escala = Math.ceil((record * 1.22) / 5) * 5;

      const totalAnio = Object.keys(MESES_DATOS)
        .filter((mes) => mes.startsWith(anio))
        .reduce((suma, mes) => suma + totalContado(mes), 0);
      $('pp-total').textContent = totalAnio;
      $('pp-year').textContent = anio;

      const anterior = mesAnterior(actual);
      const diferencia = totales[totales.length - 1] - totales[totales.length - 2];
      const chip = $('progress-delta');
      chip.dataset.signo = diferencia > 0 ? 'sube' : diferencia < 0 ? 'baja' : 'igual';
      chip.innerHTML = diferencia === 0
        ? `Igual que ${mesCorto(anterior)}`
        : `${FLECHA[diferencia > 0 ? 'sube' : 'baja']}${diferencia > 0 ? '+' : '−'}${Math.abs(diferencia)} vs ${mesCorto(anterior)}`;

      const puntos = ventana.map((mes, indice) => ({
        x: 6 + (indice * 88) / (ventana.length - 1),
        y: 100 - (totales[indice] / escala) * 100,
        mes,
        total: totales[indice],
      }));

      const trazo = curva(puntos);
      const ultimo = puntos[puntos.length - 1];
      $('area-line').setAttribute('d', trazo);
      $('area-fill').setAttribute('d', `${trazo} L ${ultimo.x} 100 L ${puntos[0].x} 100 Z`);

      $('ref-record').style.bottom = `${(record / escala) * 100}%`;
      $('ref-record').firstElementChild.textContent = `Récord ${record}`;
      $('ref-promedio').style.bottom = `${(promedio / escala) * 100}%`;
      $('ref-promedio').firstElementChild.textContent = `Promedio ${promedio}`;

      const eje = $('axis');
      eje.innerHTML = '';

      const plot = $('plot');
      [...plot.querySelectorAll('.dot, .dot-valor')].forEach((nodo) => nodo.remove());

      puntos.forEach((punto, indice) => {
        const marca = document.createElement('span');
        marca.style.left = `${punto.x}%`;
        marca.textContent = mesCorto(punto.mes);
        marca.dataset.activo = String(punto.mes === actual);
        eje.appendChild(marca);

        const nodo = document.createElement('span');
        nodo.className = 'dot';
        nodo.style.left = `${punto.x}%`;
        nodo.style.bottom = `${100 - punto.y}%`;
        plot.appendChild(nodo);

        if (indice !== puntos.length - 1) return;
        const valor = document.createElement('span');
        valor.className = 'dot-valor';
        valor.style.left = `${punto.x}%`;
        valor.style.bottom = `calc(${100 - punto.y}% + 8px)`;
        valor.textContent = punto.total;
        plot.appendChild(valor);
      });

      const detalle = puntos.map((punto) => `${mesLargo(punto.mes)} ${punto.total}`).join(', ');
      plot.setAttribute('aria-label', `Medallas por mes: ${detalle}. Promedio ${promedio}, récord ${record}.`);
    }

    /* ---------- Carrusel de consejos ---------- */
    function pintarTips() {
      const track = $('tip-track');
      const dots = $('tip-dots');
      track.innerHTML = '';
      dots.innerHTML = '';

      TIPS.forEach((tip, indice) => {
        const slide = document.createElement('li');
        slide.className = 'tip-slide';
        slide.innerHTML = `<p class="tip-text">${tip.texto}</p>`
          + `<p class="tip-source">Fuente: <a href="${tip.url}" target="_blank" rel="noopener noreferrer">${tip.fuente}</a></p>`;
        track.appendChild(slide);

        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'tip-dot';
        dot.setAttribute('aria-label', `Consejo ${indice + 1} de ${TIPS.length}`);
        dot.addEventListener('click', () => irTip(indice));
        dots.appendChild(dot);
      });

      mostrarTip();
    }

    function mostrarTip() {
      $('tip-track').style.transform = `translateX(-${tipActivo * 100}%)`;
      [...document.querySelectorAll('.tip-dot')].forEach((dot, indice) => {
        dot.setAttribute('aria-current', String(indice === tipActivo));
      });
      [...document.querySelectorAll('.tip-slide')].forEach((slide, indice) => {
        slide.inert = indice !== tipActivo;
      });
    }

    function irTip(indice) {
      tipActivo = (indice + TIPS.length) % TIPS.length;
      mostrarTip();
      reiniciarTip();
    }

    function siguienteTip() {
      tipActivo = (tipActivo + 1) % TIPS.length;
      mostrarTip();
    }

    function reiniciarTip() {
      clearInterval(tipTimer);
      if (AUTO_TIP) tipTimer = setInterval(siguienteTip, INTERVALO_TIP);
    }

    function pausarTip() {
      clearInterval(tipTimer);
      tipTimer = null;
    }

    $('tip-prev').addEventListener('click', () => irTip(tipActivo - 1));
    $('tip-next').addEventListener('click', () => irTip(tipActivo + 1));

    let inicioArrastre = null;
    const ventanaTip = $('tip-window');
    ventanaTip.addEventListener('pointerdown', (evento) => { inicioArrastre = evento.clientX; });
    ventanaTip.addEventListener('pointerup', (evento) => {
      if (inicioArrastre === null) return;
      const desplazamiento = evento.clientX - inicioArrastre;
      inicioArrastre = null;
      if (Math.abs(desplazamiento) < 40) return;
      irTip(tipActivo + (desplazamiento < 0 ? 1 : -1));
    });

    if (AUTO_TIP) {
      const cajaTip = $('tip');
      cajaTip.addEventListener('mouseenter', pausarTip);
      cajaTip.addEventListener('mouseleave', reiniciarTip);
      cajaTip.addEventListener('focusin', pausarTip);
      cajaTip.addEventListener('focusout', reiniciarTip);
      reiniciarTip();
    }

    /* ---------- Tabs ---------- */
    function pintarTabs() {
      const contenedor = $('tabs');
      contenedor.innerHTML = '';

      JUEGOS.forEach((juego) => {
        const total = totalDe(medallasDe(mesActivo, juego.id));
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'tab';
        boton.setAttribute('role', 'tab');
        boton.setAttribute('aria-selected', String(juego.id === juegoActivo));
        boton.dataset.vacio = String(total === 0);
        boton.style.setProperty('--accent', juego.acento);
        boton.innerHTML = `${ICONOS[juego.id]}<span>${juego.corto}</span><span class="cuenta">${total}</span>`;
        boton.addEventListener('click', () => {
          juegoActivo = juego.id;
          pintarTabs();
          pintarTarjeta();
        });
        contenedor.appendChild(boton);
      });
    }

    /* ---------- Selector de mes ---------- */
    function pintarSelector() {
      $('month-current').textContent = formatearMes(mesActivo);

      const menu = $('month-menu');
      menu.innerHTML = '';

      MESES.forEach((mes) => {
        const total = JUEGOS.reduce((suma, juego) => suma + totalDe(medallasDe(mes, juego.id)), 0);
        const item = document.createElement('li');
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'month-option';
        boton.dataset.empty = String(total === 0);
        boton.setAttribute('role', 'option');
        boton.setAttribute('aria-current', String(mes === mesActivo));
        boton.innerHTML = `<span>${formatearMes(mes)}</span>${
          mes === MESES[0] ? '<span class="tag">Mes actual</span>' : `<span>${total}</span>`
        }`;
        boton.addEventListener('click', () => {
          mesActivo = mes;
          cerrarMenu();
          pintarSelector();
          pintarTabs();
          pintarTarjeta();
        });
        item.appendChild(boton);
        menu.appendChild(item);
      });
    }

    function abrirMenu() {
      $('month-menu').hidden = false;
      $('month-toggle').setAttribute('aria-expanded', 'true');
    }

    function cerrarMenu() {
      $('month-menu').hidden = true;
      $('month-toggle').setAttribute('aria-expanded', 'false');
    }

    $('month-toggle').addEventListener('click', () => {
      const abierto = $('month-toggle').getAttribute('aria-expanded') === 'true';
      abierto ? cerrarMenu() : abrirMenu();
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.month-wrap')) cerrarMenu();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') cerrarMenu();
    });

    /* ---------- Tarjeta ---------- */
    function pintarTarjeta() {
      const juego = JUEGOS.find((item) => item.id === juegoActivo);
      const medallas = medallasDe(mesActivo, juego.id);
      const total = totalDe(medallas);
      const rendimiento = RENDIMIENTO[juego.id];
      const card = $('card');

      card.style.setProperty('--accent', juego.acento);
      $('game-icon').innerHTML = ICONOS[juego.id];
      $('game-title').textContent = juego.titulo;
      $('game-focus').textContent = juego.enfoque;
      $('game-total').textContent = total === 0
        ? 'Sin medallas'
        : `${total} ${total === 1 ? 'medalla' : 'medallas'}`;

      $('medals-label').textContent = formatearMes(mesActivo);

      const lista = $('medals');
      lista.innerHTML = '';
      GRADOS.forEach((grado) => {
        const cantidad = medallas[grado];
        const item = document.createElement('li');
        item.className = `seal g-${grado}`;
        item.dataset.cero = String(cantidad === 0);
        item.setAttribute('aria-label', `${cantidad} ${cantidad === 1 ? 'medalla' : 'medallas'} ${grado}`);
        item.innerHTML = `<span class="marca" aria-hidden="true">${grado === 'S' ? ARO : ''}<span class="letra">${grado}</span></span><span class="cantidad" aria-hidden="true">${cantidad}</span>`;
        lista.appendChild(item);
      });

      $('empty').hidden = total > 0;
      $('history').textContent = `Histórico · ${resumenHistorico(HISTORICO[juego.id])}`;
      $('stat-played').textContent = rendimiento.completadas;
      $('stat-best').textContent = formatearDuracion(rendimiento.mejor);
      $('stat-avg').textContent = formatearDuracion(rendimiento.promedio);
      $('stat-last').textContent = `Último intento: ${formatearFecha(rendimiento.ultima)}`;
    }

    pintarTips();
    pintarSelector();
    pintarTabs();
    pintarTarjeta();
    pintarProgreso();
  </script>
</body>
</html>
